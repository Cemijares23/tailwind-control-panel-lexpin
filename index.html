<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <!-- Tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font Awesome -->
    <script
      src="https://kit.fontawesome.com/7cccb70f7a.js"
      crossorigin="anonymous"
    ></script>

    <!-- Flowbite -->
    <link
      href="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.js"></script>
  </head>
  <body
    class="h-screen bg-slate-150 dark:bg-slate-900/95 text-slate-800 dark:text-slate-100"
  >
    <div class="flex h-full">
      <aside
        class="hidden border-r border-slate-400/50 bg-slate-300 dark:bg-slate-900 dark:border-slate-200/20 md:flex md:flex-col md:h-full"
      >
        <h2 class="text-lg text-center font-semibold p-1">Dashboard</h2>
        <hr class="border border-slate-300 dark:border-slate-700" />
        <nav
          class="flex flex-col gap-y-1 text-sm h-full p-2 *:hover:bg-slate-300 *:dark:hover:bg-slate-600 *:rounded-sm *:py-1 *:px-2"
        >
          <a
            href="#"
            class="flex items-center gap-2 bg-blue-200 hover:bg-blue-200 dark:bg-blue-600 dark:hover:bg-blue-600"
          >
            <i class="fa-solid fa-house"></i>
            <p>Inicio</p>
          </a>
          <a href="#" class="flex items-center gap-2">
            <i class="fa-solid fa-users"></i>
            <p>Usuarios</p>
          </a>
          <a href="#" class="flex items-center gap-2">
            <i class="fa-solid fa-box-open"></i>
            <p>Productos</p>
          </a>
          <a href="#" class="flex items-center gap-2">
            <i class="fa-solid fa-truck"></i>
            <p>Pedidos</p>
          </a>
          <a href="#" class="flex items-center gap-2">
            <i class="fa-solid fa-chart-column"></i>
            <p>Reportes</p>
          </a>
          <a href="#" class="flex items-center gap-2">
            <i class="fa-solid fa-gear"></i>
            <p>Ajustes</p>
          </a>
        </nav>
        <div
          class="border-t border-slate-400/50 dark:border-slate-200/50 flex justify-between text-sm p-2"
        >
          <a href="#">
            <i class="fa-solid fa-circle-user"></i>
          </a>
          <a href="#">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
          </a>
        </div>
      </aside>
      <div class="flex flex-col flex-1">
        <header class="bg-slate-300 dark:bg-slate-900">
          <nav class="flex justify-between items-center p-2">
            <div class="flex items-center gap-2">
              <button class="hover:cursor-pointer md:hidden">
                <i class="fa-solid fa-bars"></i>
              </button>
              <div
                class="hidden md:flex items-center text-xs bg-slate-700/60 rounded-full py-1 px-2 gap-2"
              >
                <i class="fa-solid fa-magnifying-glass"></i>
                <input
                  class="bg-transparent border-0 text-xs p-0 w-[8rem]"
                  type="search"
                  value="Search"
                />
              </div>
            </div>
            <div class="flex items-center gap-2">
              <button class="md:hidden">
                <i class="hidden fa-solid fa-magnifying-glass"></i>
              </button>
              <button>
                <i class="fa-regular fa-bell"></i>
              </button>
              <button>
                <i class="fa-regular fa-envelope"></i>
              </button>
              <button>
                <i class="fa-regular fa-circle-user"></i>
              </button>
            </div>
          </nav>
        </header>
        <main>Main</main>
        <footer>Footer</footer>
      </div>
    </div>
  </body>
</html>
